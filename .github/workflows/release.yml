# CD: on a version tag (v1.0.0, v1.0.1-rc.1, ...), build the binary for all
# major platforms and attach them to a GitHub Release. The release is created
# with draft=true so it can be reviewed before publishing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: |
          BIN=k8s-ctx-dumper
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN="$BIN.exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w \
              -X k8s-ctx-dumper/cmd.version=${GITHUB_REF_NAME#v} \
              -X k8s-ctx-dumper/cmd.commit=${{ github.sha }} \
              -X k8s-ctx-dumper/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$BIN" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
