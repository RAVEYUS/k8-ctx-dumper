# CD: on a version tag (v1.0.0, v1.0.1-rc.1, ...), build the binary for all
# major platforms and attach them to a GitHub Release, and publish a
# multi-arch Docker image to Docker Hub. The release is created with
# draft=true so it can be reviewed before publishing.
#
# Docker Hub publishing requires two repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# (https://github.com/RAVEYUS/k8-ctx-dumper/settings/secrets/actions)
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: |
          BIN=k8s-ctx-dumper
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN="$BIN.exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w \
              -X k8s-ctx-dumper/cmd.version=${GITHUB_REF_NAME#v} \
              -X k8s-ctx-dumper/cmd.commit=${{ github.sha }} \
              -X k8s-ctx-dumper/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$BIN" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # Publish a multi-arch image to Docker Hub (linux/amd64 + linux/arm64).
  # Tagged with the version (vX.Y.Z) and "latest" for stable releases.
  docker:
    name: Docker publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/k8s-ctx-dumper', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${GITHUB_REF_NAME#v}
            COMMIT=${{ github.sha }}
            BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
