# OpenSSF Scorecard: automated supply-chain security assessment.
# Runs on every push and weekly; results appear on the security dashboard.
# Docs: https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security
on:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 00:33 UTC (off-peak).
    - cron: "33 0 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the security dashboard.
      security-events: write
      # Needed to publish results to a branch-protected main.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
