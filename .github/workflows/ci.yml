# CI: run on every push to any branch and on pull requests. Mirrors the local
# quality gate (build + vet + gofmt + tests) and adds race detection so data
# races in the concurrent fetch path are caught early.
#
# The Go matrix tracks the module's `go` directive (1.26.2 in go.mod); older
# toolchains can't build it because setup-go sets GOTOOLCHAIN=local.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI never needs write access.
permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  fuzz:
    name: Fuzz (regression)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzParseResources
          - FuzzSanitize
          - FuzzMarkdownFormat
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run fuzz target (${{ matrix.target }})
        run: |
          go test ./... -run '^$' -fuzz '${{ matrix.target }}' -fuzztime 30s
  build:
    name: Build (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build with ldflags
        run: |
          go build -trimpath \
            -ldflags "-X k8s-ctx-dumper/cmd.version=${{ github.ref_name }} \
                      -X k8s-ctx-dumper/cmd.commit=${{ github.sha }} \
                      -X k8s-ctx-dumper/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o k8s-ctx-dumper .
      - name: Smoke test binary
        run: ./k8s-ctx-dumper version
